# Bağımlılık ve Action güncellemeleri (OWASP A03).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 6'da sabit: @astrojs/check TS 7'yi desteklemiyor (peer: ^5 || ^6).
      # @astrojs/check desteği gelince kaldırılır.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
