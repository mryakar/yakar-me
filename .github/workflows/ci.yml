# Kontrol + yayın hattı (OWASP A03, A08, A10).
# Action'lar commit SHA'sına sabit; Dependabot günceller. Yayın yalnızca main'den, kontrol yeşilse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # İçerik politikası: dosya adları, içerik, tüm commit'ler ve PR metni gizli bir desen listesine
      # karşı denetlenir. Liste secret'ta; eksikse kontrol kapalı başarısız olur.
      - name: Content policy
        env:
          DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }} ${{ github.head_ref }}
        run: |
          shopt -s lastpipe
          [ -n "$DENYLIST" ] || { echo "::error::CONTENT_DENYLIST secret is missing"; exit 1; }
          deny="$RUNNER_TEMP/deny"; printf '%s\n' "$DENYLIST" > "$deny"
          # 0 = match, 1 = no match, anything else = grep error -> fail closed.
          hit() { local rc=0; grep -qIiEf "$deny" "$@" || rc=$?; [ $rc -le 1 ] || { echo "::error::grep error $rc"; exit 2; }; return $rc; }
          fail=0
          git ls-files | hit && { echo "::error::file name"; fail=1; }
          for f in $(git ls-files | grep -v '^package-lock.json$'); do
            hit "$f" && { echo "::error::content: $f"; fail=1; }
          done
          for c in $(git rev-list HEAD); do
            git show -s --format='%an%n%ae%n%cn%n%ce%n%B' "$c" | hit && { echo "::error::commit $c"; fail=1; }
          done
          printf '%s' "$PR_TEXT" | hit && { echo "::error::pull request text"; fail=1; }
          rm -f "$deny"
          exit $fail
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm audit
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
